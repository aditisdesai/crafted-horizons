<!-- Copy these meta tags into the <head> section of each HTML page -->

<!-- Favicons / App icons -->
<link rel="icon" href="assets/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon-180x180.png">
<link rel="manifest" href="site.webmanifest">

<!-- Theme color for mobile browser UI -->
<meta name="theme-color" content="#1f6f8b">

<!-- Social sharing (Open Graph + Twitter) -->
<meta property="og:title" content="Crafted Horizons — Travel, booked with care">
<meta property="og:description" content="Thoughtful travel planning shaped by a lifelong love of travel.">
<meta property="og:image" content="https://crafted-horizons.com/assets/brand/social-square-1080.png">
<meta property="og:url" content="https://crafted-horizons.com/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://crafted-horizons.com/assets/brand/social-square-1080.png">
